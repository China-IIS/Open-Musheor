plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java'
}

version = '1.7.1'
group = 'com.musheor'

base {
    archivesName = 'musheor'
}

repositories {
    maven { name = 'meteor'; url = 'https://maven.meteordev.org/releases' }
    maven { name = 'meteor-snapshots'; url = 'https://maven.meteordev.org/snapshots' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "meteordevelopment:meteor-client:1.21.11-SNAPSHOT"
    modCompileOnly files("libs/baritone.jar")
    // Production Fabric jars are intermediary; Loom remaps them to Yarn for compilation.
    modCompileOnly files("libs/litematica-fabric-1.21.11-0.26.16.jar")
    modCompileOnly files("libs/malilib-fabric-1.21.11-0.27.20.jar")
    modCompileOnly files("libs/xaerominimap-fabric-1.21.11-25.3.5.jar")
    modCompileOnly files("libs/xaeroworldmap-fabric-1.21.11-1.40.6.jar")
    modCompileOnly files("libs/XaeroPlus-2.30.3+fabric-1.21.11-WM1.40.6-MM25.3.5.jar")
    modCompileOnly files("libs/ViaFabricPlus-4.4.15.jar")
    modCompileOnly files("libs/xaerolib-fabric-1.21.11-1.0.45.jar")
    // ViaVersion has no Minecraft namespace; use the authentic jar nested by ViaFabricPlus.
    compileOnly files("libs/viaversion-common-5.12.0-SNAPSHOT.jar")
    implementation files('libs/Java-WebSocket-1.5.4.jar')
}

loom {
    accessWidenerPath = file("src/main/resources/musheor.accesswidener")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:none', '-nowarn', '-Xmaxerrs', '2000']
}

// Preserve the original Fabric nested dependency without Loom's module-component resolver.
jar {
    into('META-INF/jars') {
        from('libs/Java-WebSocket-1.5.4.jar')
    }
}

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
